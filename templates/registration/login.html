{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión | Diphasac</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(135deg, #006aff, #0d47a1);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-diphasac {
            height: 55px;
            object-fit: contain;
        }

        h2 {
            font-weight: 700;
            color: #0d47a1;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-control:focus {
            border-color: #006aff !important;
            box-shadow: 0 0 0 0.2rem rgba(0, 106, 255, 0.25);
        }

        .btn-primary {
            background-color: #006aff;
            border-color: #006aff;
            font-size: 1.1rem;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #004bbd;
            border-color: #004bbd;
        }

        .lock-icon {
            font-size: 55px;
            color: #0d47a1;
            display: block;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="login-card">
    <!-- LOGO -->
    <div class="text-center mb-3">
        <img src="https://res.cloudinary.com/drf02su75/image/upload/LOGO_DIPHASAC_AZUL_yjjvfp.png"
             alt="Diphasac" class="logo-diphasac">
    </div>

    <!-- Candado opcional -->
    <i class="bi bi-shield-lock lock-icon"></i>

    <h2>Iniciar sesión</h2>

    {% if form.errors %}
        <div class="alert alert-danger mb-3">
            Usuario o contraseña incorrectos.
        </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <!-- Usuario -->
        <div class="mb-3">
            <label for="id_username" class="form-label fw-bold">Correo electrónico</label>
            <input type="text"
                   name="username"
                   required
                   autofocus
                   id="id_username"
                   class="form-control"
                   value="{{ form.username.value|default_if_none:'' }}">
        </div>

        <!-- Password con botón mostrar -->
        <div class="mb-4">
            <label for="id_password" class="form-label fw-bold">Contraseña</label>
            <div class="input-group">
                <input type="password"
                       name="password"
                       required
                       id="id_password"
                       class="form-control">
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                    <i class="bi bi-eye" id="toggleIcon"></i>
                </button>
            </div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Ingresar</button>
        </div>
    </form>

</div>

<script>
const input = document.getElementById('id_password');
const btn = document.getElementById('togglePassword');
const icon = document.getElementById('toggleIcon');

btn.addEventListener('click', () => {
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    icon.classList.toggle('bi-eye', showing);
    icon.classList.toggle('bi-eye-slash', !showing);
});
</script>

</body>
</html>
